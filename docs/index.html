      scrollbar-width: none;

    /* 3D Flashcard Flip Animation */
    .flip-perspective {
      perspective: 1000px;
    }
    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .flip-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-back {
      transform: rotateY(180deg);
    }

    /* Modal bottom-sheet entrance */

      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-sheet {
      animation: sheetUp 0.22s ease-out forwards;
    }

      from {
        opacity: 0;
        transform: translate(-50%, 12px);

      to {

      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getCourse(courseId) {
      if (!courseId) return null;
      return state.courses.find((c) => c.id === courseId) || null;
    }

    function getCourseBadgeHtml(courseId, extraClasses = '') {
      const course = getCourse(courseId);
      if (!course) {
        return `<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 ${extraClasses}">📂 Uncategorized</span>`;

      const theme = COLOR_MAP[course.color] || COLOR_MAP.indigo;
      return `<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full ${theme.bg} ${theme.text} border ${theme.border} ${extraClasses}">📘 ${escapeHtml(course.name)}</span>`;
    }

    function buildCourseOptionsHtml(selectedCourseId) {
      const courseOpts = state.courses
        .map(
          (c) =>
            `<option value="${escapeHtml(c.id)}" ${selectedCourseId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`
        )
        .join('');
      return `
        ${courseOpts}
        <option value="" ${!selectedCourseId ? 'selected' : ''}>Uncategorized</option>
      `;
    }

    // =========================================================================

    let toastTimer = null;
    function showToast(message, icon = '✨') {
      const root = document.getElementById('toast-root');
      const box = document.getElementById('toast-message');
      if (!root || !box) return;
      box.innerHTML = `<span class="text-sm">${icon}</span><span>${escapeHtml(message)}</span>`;
      root.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        root.classList.add('hidden');
      }, 2600);
    }

    function recordStudyProgress(label) {
      state.dailyGoalCompleted = Math.min(state.dailyGoalTarget, state.dailyGoalCompleted + 1);
      state.totalSessions += 1;
      if (!state.studyDays.includes(state.selectedCalendarDay)) {
        state.studyDays.push(state.selectedCalendarDay);
      }
      playPrototypeChime(740);
      showToast(label, '🔥');
    }

    function playPrototypeChime(freq = 660) {
      if (!state.soundEffectsEnabled || state.soundVolume <= 0) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const vol = Math.max(0.01, (state.soundVolume / 100) * 0.14);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.25, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.19);
      } catch (_) {
        // Ignore if browser blocks audio before user interaction
      }
    }

      return `

          <p class="text-xs text-[#64748B] mt-0.5">Flashcards &amp; self-assessment quizzes</p>

        <div class="bg-slate-200/75 p-1 rounded-2xl grid grid-cols-2 gap-1 mb-3.5">
          <button
            type="button"
            onclick="setToolsSubTab('flashcards')"

              isFlashcards ? 'bg-white text-[#4F46E5] shadow-xs' : 'text-[#64748B] hover:text-slate-900'

          <button
            type="button"
            onclick="openGenerateAiModal(${preselectedCourse ? `'${escapeHtml(preselectedCourse)}'` : 'null'})"

            <span>Generate with AI</span>
          </button>
          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              onclick="${isFlashcards ? 'openManageDecksModal()' : 'openManageQuizzesModal()'}"

              <span>⚙️</span>
              <span>${isFlashcards ? 'Manage Flashcards' : 'Manage Quizzes'}</span>

            <button

    // =========================================================================
    // 8. RESOURCES TAB (BOOKS WITH COURSE CATEGORIZATION)
    // =========================================================================
    function setResourcesCourseFilter(filterVal) {
      state.resourcesCourseFilter = filterVal;
      renderApp();
    }

    function reassignBookCourse(bookId, newCourseId) {
      const book = state.books.find((b) => b.id === bookId);
      if (!book) return;
      book.courseId = newCourseId || null;
      const label = book.courseId ? getCourse(book.courseId)?.name : 'Uncategorized';
      showToast(`Moved "${book.title}" to ${label}`, '📚');
      renderApp();
    }

    function renderResourcesScreen() {
      const filteredBooks = filterByCourseChoice(state.books, state.resourcesCourseFilter);

      const booksHtml =
        filteredBooks.length === 0
          ? `<div class="bg-white border border-[#E2E8F0] rounded-[20px] p-6 text-center">
              <p class="text-sm font-bold text-slate-800">No books in this category</p>
              <p class="text-xs text-[#64748B] mt-1">Tap <strong>＋ Add Book</strong> above or reassign an existing book's course.</p>
            </div>`
          : filteredBooks
              .map((book) => {
                const course = getCourse(book.courseId);
                const theme = course ? COLOR_MAP[course.color] || COLOR_MAP.indigo : null;

                return `
                  <div class="bg-white border border-[#E2E8F0] rounded-[20px] p-4 shadow-[0_1px_2px_rgba(15,23,42,0.03)]">
                    <div class="flex items-start gap-3">
                      <div class="w-11 h-14 rounded-xl ${
                        theme ? `${theme.bg} ${theme.text} border ${theme.border}` : 'bg-slate-100 text-slate-600 border border-slate-200'
                      } flex flex-col items-center justify-center shrink-0 font-extrabold text-xs">
                        <span>📕</span>
                        <span class="text-[9px] mt-0.5">PDF</span>
                      </div>

                      <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-2 mb-1">

                          <span class="text-[11px] font-bold text-emerald-600">${book.progressPct}%</span>
                        </div>
                        <h3 class="text-sm font-bold text-[#0F172A] leading-snug">${escapeHtml(book.title)}</h3>
                        <p class="text-[11px] text-[#64748B] mt-0.5">${escapeHtml(book.author)} • ${escapeHtml(book.pages)}</p>

                        <!-- Reading Progress Bar -->
                        <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden mt-2.5">
                          <div class="h-full bg-[#10B981] rounded-full transition-all" style="width: ${book.progressPct}%"></div>
                        </div>
                      </div>

                    <!-- Inline Course Categorization Selector + Open Reader -->
                    <div class="flex items-center justify-between gap-2 mt-3.5 pt-3 border-t border-slate-100">

                        <select

                          onchange="reassignBookCourse('${escapeHtml(book.id)}', this.value)"

                      </div>

                      <button

                        onclick="openBookReaderModal('${escapeHtml(book.id)}')"

                        Read →

                    </div>

            <h1 class="text-[22px] font-extrabold tracking-tight text-[#0F172A]">Study Resources</h1>

            class="shrink-0 bg-[#4F46E5] hover:bg-indigo-700 text-white text-xs font-bold px-3.5 py-2 rounded-2xl shadow-sm transition-all"
          >
            ＋ Add Book
          </button>
        </div>

        <!-- Course Filter Chips -->
        ${renderFilterChipsHtml(state.resourcesCourseFilter, 'setResourcesCourseFilter')}

        <!-- Books List -->
        <div class="space-y-3">
          ${booksHtml}
        </div>
      `;

    // =========================================================================
    // 9. HOME, PROFILE & SETTINGS, AND STREAK TABS
    // =========================================================================
    function getUserInitials(name) {
      const parts = (name || 'A').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    function formatReminderTime12h(time24) {
      const [hStr, mStr] = (time24 || '19:30').split(':');
      let h = parseInt(hStr, 10);
      if (Number.isNaN(h)) h = 19;
      const suffix = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${h12}:${mStr || '30'} ${suffix}`;
    }

    function renderHomeScreen() {
      const pct = Math.min(100, Math.round((state.dailyGoalCompleted / state.dailyGoalTarget) * 100));
      const nextCourse = state.courses[0];
      const nextLesson = nextCourse?.lessons.find((l) => !l.completed) || nextCourse?.lessons[0];
      const firstName = (state.user.name || 'Charls').split(' ')[0];
      const initials = getUserInitials(state.user.name);

      return `
        <!-- Top Greeting Header -->
        <div class="flex items-center justify-between gap-2 pt-1 mb-4">
          <div class="min-w-0">
            <p class="text-[11px] font-bold uppercase tracking-wider text-[#64748B]">Wednesday, Nov 18</p>
            <h1 class="text-[20px] font-extrabold text-[#0F172A] truncate">Welcome back, ${escapeHtml(firstName)}!</h1>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button
              type="button"
              onclick="switchTab('streak')"
              class="inline-flex items-center gap-1 bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1.5 rounded-full text-xs font-extrabold"
            >
              <span>🔥</span>
              <span>${state.streakCount}d</span>
            </button>
            <button
              type="button"
              onclick="openProfileScreen()"
              title="Open Profile & Settings"
              class="w-9 h-9 rounded-full bg-gradient-to-br from-[#4F46E5] to-indigo-700 text-white font-extrabold text-xs flex items-center justify-center shadow-sm ring-2 ring-indigo-100 hover:scale-105 transition-transform"
            >
              ${escapeHtml(initials)}
            </button>
          </div>
        </div>

        <!-- Daily Study Goal Hero Card -->
        <div class="bg-gradient-to-br from-[#4F46E5] to-indigo-700 text-white rounded-[22px] p-4 mb-4 shadow-sm">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold text-indigo-100">Daily Study Goal</span>
            <span class="text-xs font-extrabold bg-white/15 px-2.5 py-0.5 rounded-full">${pct}%</span>
          </div>
          <p class="text-lg font-extrabold">
            ${state.dailyGoalCompleted} of ${state.dailyGoalTarget} tasks completed
          </p>
          <div class="w-full h-2 bg-white/20 rounded-full overflow-hidden mt-3">
            <div class="h-full bg-[#10B981] rounded-full transition-all" style="width: ${pct}%"></div>
          </div>
          <div class="flex items-center justify-between mt-3 pt-2.5 border-t border-white/15 text-xs">
            <span class="text-indigo-100">${
              state.dailyGoalCompleted >= state.dailyGoalTarget ? '🎉 Daily Goal Achieved!' : 'Keep momentum going today'
            }</span>
            <button type="button" onclick="switchTab('courses')" class="font-bold underline">Study Now →</button>
          </div>
        </div>

        <!-- Quick Module Grid -->
        <div class="grid grid-cols-2 gap-2.5 mb-4">
          <button type="button" onclick="switchTab('courses')" class="bg-white border border-[#E2E8F0] rounded-[20px] p-3.5 text-left hover:border-indigo-300 transition-all">
            <span class="text-lg">📚</span>
            <p class="text-sm font-bold text-[#0F172A] mt-1">Courses</p>
            <p class="text-[11px] text-[#64748B]">${state.courses.length} active subjects</p>
          </button>
          <button type="button" onclick="switchTab('tools')" class="bg-white border border-[#E2E8F0] rounded-[20px] p-3.5 text-left hover:border-indigo-300 transition-all">
            <span class="text-lg">⚡</span>
            <p class="text-sm font-bold text-[#0F172A] mt-1">Tools</p>
            <p class="text-[11px] text-[#64748B]">${state.decks.length} decks • ${state.quizzes.length} quizzes</p>
          </button>
          <button type="button" onclick="switchTab('resources')" class="bg-white border border-[#E2E8F0] rounded-[20px] p-3.5 text-left hover:border-indigo-300 transition-all">
            <span class="text-lg">📖</span>
            <p class="text-sm font-bold text-[#0F172A] mt-1">Resources</p>
            <p class="text-[11px] text-[#64748B]">${state.books.length} categorized books</p>
          </button>
          <button type="button" onclick="openGenerateAiModal(null)" class="bg-indigo-50/80 border border-indigo-200 rounded-[20px] p-3.5 text-left hover:bg-indigo-100/70 transition-all">
            <span class="text-lg">✨</span>
            <p class="text-sm font-bold text-[#4F46E5] mt-1">AI Studio</p>
            <p class="text-[11px] text-indigo-700/80">Generate cards &amp; quiz</p>
          </button>
        </div>

        <!-- Continue Studying Card -->
        ${
          nextCourse && nextLesson
            ? `
          <div class="bg-white border border-[#E2E8F0] rounded-[20px] p-4">
            <p class="text-[11px] font-extrabold uppercase tracking-wider text-[#64748B] mb-2">Continue Studying</p>
            <div
              onclick="openLessonReaderModal('${escapeHtml(nextCourse.id)}', '${escapeHtml(nextLesson.id)}')"
              class="cursor-pointer flex items-center justify-between gap-3"
            >
              <div>
                ${getCourseBadgeHtml(nextCourse.id, 'mb-1.5')}
                <h3 class="text-sm font-bold text-[#0F172A]">${escapeHtml(nextLesson.title)}</h3>
                <p class="text-[11px] text-[#64748B] mt-0.5">${escapeHtml(nextLesson.readTime)}</p>
              </div>
              <span class="text-xs font-bold text-[#4F46E5] shrink-0">Resume →</span>
            </div>
          </div>
        `
            : ''
        }
      `;
    }

    // Profile & Settings Actions & Screen (Enrolled Subjects removed; Sound Volume + Dark Mode included)
    function setDailyGoalTarget(target) {
      state.dailyGoalTarget = target;
      renderApp();
      showToast(`Daily study goal set to ${target} task${target === 1 ? '' : 's'}`, '🎯');
    }

    function toggleReminderSetting() {
      state.reminderEnabled = !state.reminderEnabled;
      renderApp();
      showToast(
        state.reminderEnabled
          ? `Daily reminder ON (${formatReminderTime12h(state.reminderTime)})`
          : 'Daily study reminder turned off',
        '🔔'
      );
    }

    function updateReminderTimeSetting(newVal) {
      if (!newVal) return;
      state.reminderTime = newVal;
      renderApp();
      showToast(`Reminder time updated to ${formatReminderTime12h(newVal)}`, '🕒');
    }

    function toggleSoundEffectsSetting() {
      state.soundEffectsEnabled = !state.soundEffectsEnabled;
      if (state.soundEffectsEnabled) {
        if (state.soundVolume === 0) state.soundVolume = 75;
        playPrototypeChime(660);
      }
      renderApp();
      showToast(state.soundEffectsEnabled ? 'Sound effects turned on' : 'Sound effects muted', '🔊');
    }

    function updateSoundVolumeSetting(val) {
      const numeric = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
      state.soundVolume = numeric;
      if (numeric === 0 && state.soundEffectsEnabled) {
        state.soundEffectsEnabled = false;
      } else if (numeric > 0 && !state.soundEffectsEnabled) {
        state.soundEffectsEnabled = true;
      }
      renderApp();
      playPrototypeChime(580 + numeric * 2);
    }

    function toggleDarkModeSetting() {
      state.darkMode = !state.darkMode;
      renderApp();
      showToast(state.darkMode ? 'Dark mode enabled' : 'Light mode enabled', state.darkMode ? '🌙' : '☀️');
    }

    function renderProfileScreen() {
      const initials = getUserInitials(state.user.name);
      const lessonsDoneCount = state.courses
        .flatMap((c) => c.lessons)
        .filter((l) => l.completed).length;
      const savedBooksCount = state.books.length;

      return `
        <!-- Top Back Header -->
        <div class="flex items-center gap-3 pt-1 mb-4">
          <button
            type="button"
            onclick="closeProfileScreen()"
            aria-label="Back from Profile & Settings"
            class="w-9 h-9 rounded-full bg-white border border-[#E2E8F0] flex items-center justify-center text-sm font-extrabold text-[#0F172A] hover:border-indigo-300 transition-all"
          >
            ←
          </button>
          <h1 class="text-[20px] font-extrabold tracking-tight text-[#0F172A]">Profile &amp; Settings</h1>
        </div>

        <div class="space-y-3.5 pb-6">
          <!-- Identity Card -->
          <div class="bg-white border border-[#E2E8F0] rounded-[24px] p-5 text-center shadow-[0_1px_2px_rgba(15,23,42,0.03)]">
            <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-[#4F46E5] to-blue-600 text-white font-extrabold text-xl flex items-center justify-center shadow-md shadow-indigo-200/70 mb-3">
              ${escapeHtml(initials)}
            </div>
            <h2 class="text-base font-extrabold text-[#0F172A]">${escapeHtml(state.user.name)}</h2>
            <p class="text-xs text-[#64748B] mt-0.5">${escapeHtml(state.user.email)}</p>
            <span class="inline-block mt-2.5 text-[11px] font-bold px-3 py-1 rounded-full bg-indigo-50 text-[#4F46E5]">
              ${escapeHtml(state.user.level || 'Student')}
            </span>
          </div>

          <!-- 3 Stat Tiles -->
          <div class="grid grid-cols-3 gap-2.5">
            <div class="bg-gradient-to-br from-amber-500 to-orange-500 text-white rounded-[20px] p-3 text-center shadow-xs">
              <p class="text-base font-extrabold">🔥 ${state.streakCount}</p>
              <p class="text-[10px] font-bold text-amber-50 mt-0.5">Day Streak</p>
            </div>
            <div class="bg-white border border-[#E2E8F0] rounded-[20px] p-3 text-center">
              <p class="text-base font-extrabold text-[#10B981]">${lessonsDoneCount}</p>
              <p class="text-[10px] font-bold text-[#64748B] mt-0.5">Lessons Done</p>
            </div>
            <div class="bg-white border border-[#E2E8F0] rounded-[20px] p-3 text-center">
              <p class="text-base font-extrabold text-[#4F46E5]">${savedBooksCount}</p>
              <p class="text-[10px] font-bold text-[#64748B] mt-0.5">Saved Books</p>
            </div>
          </div>

          <!-- Daily Study Goal Card -->
          <div class="bg-white border border-[#E2E8F0] rounded-[22px] p-4 shadow-[0_1px_2px_rgba(15,23,42,0.03)]">

            <p class="text-xs text-[#64748B] mt-1">How many study tasks will you finish each day?</p>

            <div class="grid grid-cols-3 gap-2 my-3">
              ${[1, 3, 5]
                .map((goal) => {
                  const selected = state.dailyGoalTarget === goal;
                  const label = `${goal} task${goal === 1 ? '' : 's'}`;
                  return `
                    <button
                      type="button"
                      onclick="setDailyGoalTarget(${goal})"
                      class="py-2.5 px-2 rounded-full text-xs font-extrabold border transition-all ${
                        selected
                          ? 'bg-[#4F46E5] text-white border-[#4F46E5] shadow-xs'
                          : 'bg-white text-[#0F172A] border-[#E2E8F0] hover:border-indigo-300'
                      }"
                    >
                      ${selected ? `✓ ${label}` : label}
                    </button>
                  `;
                })
                .join('')}
            </div>

            <p class="text-[10px] text-[#64748B] leading-relaxed">
              Each completed lesson, deck, quiz, or book session counts as one task.
            </p>
          </div>

          <!-- Daily Study Reminder Card -->
          <div class="bg-white border border-[#E2E8F0] rounded-[22px] p-4 shadow-[0_1px_2px_rgba(15,23,42,0.03)] flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-base shrink-0">
                🔔
              </div>
              <div class="min-w-0">
                <p class="text-xs font-extrabold text-[#0F172A]">Daily Study Reminder</p>
                <div class="flex items-center gap-2 mt-1">
                  <label class="inline-flex items-center gap-1 bg-indigo-50 text-[#4F46E5] text-[11px] font-bold px-2.5 py-0.5 rounded-full cursor-pointer">
                    <span>🕒</span>
                    <span>${escapeHtml(formatReminderTime12h(state.reminderTime))}</span>
                    <input
                      type="time"
                      value="${escapeHtml(state.reminderTime)}"
                      onchange="updateReminderTimeSetting(this.value)"
                      class="sr-only"
                    />

    function selectStreakDay(day) {

            <p class="text-[10px] font-bold text-amber-50">Current</p>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-[20px] p-3 text-center">
            <p class="text-lg font-extrabold text-[#4F46E5]">${state.bestStreak}</p>
            <p class="text-[10px] font-bold text-[#64748B]">Best Streak</p>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-[20px] p-3 text-center">

            <p class="text-[10px] font-bold text-[#64748B]">Sessions</p>
          </div>
        </div>

        <div class="bg-white border border-[#E2E8F0] rounded-[22px] p-4 mb-4">

            <span class="text-[11px] font-bold text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-full">🔥 = Study Day</span>
          </div>
          <div class="grid grid-cols-7 gap-1.5 text-center">
            ${['S', 'M', 'T', 'W', 'T', 'F', 'S']
              .map((d) => `<span class="text-[10px] font-extrabold text-[#64748B]">${d}</span>`)
              .join('')}
            ${days
              .map((d) => {
                const studied = state.studyDays.includes(d);
                const selected = state.selectedCalendarDay === d;

                      selected

          <p class="text-xs font-extrabold text-[#0F172A] mb-1">Activity on Nov ${state.selectedCalendarDay}, 2026</p>
          <p class="text-xs text-[#64748B]">
            ${

    // =========================================================================
    // 10. MODALS: MANAGE COURSES & MANAGE LESSONS (WITH PDF UPLOAD)
    // =========================================================================
    function openModal(html) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `<div class="animate-sheet w-full bg-white rounded-t-[28px] sm:rounded-[26px] max-h-[88%] flex flex-col overflow-hidden shadow-2xl border border-slate-200">${html}</div>`;
      root.classList.remove('hidden');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (!root) return;
      root.classList.add('hidden');
      root.innerHTML = '';
    }

    let selectedNewCourseColor = 'indigo';

    function pickCourseColor(colorKey) {
      selectedNewCourseColor = colorKey;
      openManageCoursesModal();
    }

    function openManageCoursesModal() {
      const colorKeys = Object.keys(COLOR_MAP);
      const colorsHtml = colorKeys
        .map((key) => {
          const c = COLOR_MAP[key];
          const isPicked = selectedNewCourseColor === key;
          return `
            <button
              type="button"
              onclick="pickCourseColor('${key}')"
              class="px-2.5 py-1 rounded-full text-[11px] font-bold border transition-all ${c.bg} ${c.text} ${
                isPicked ? `ring-2 ${c.ring} border-transparent` : c.border
              }"
            >
              ${c.label}
            </button>
          `;
        })
        .join('');

      const existingCoursesHtml =
        state.courses.length === 0
          ? `<p class="text-xs text-[#64748B] py-2">No courses available. Add one above.</p>`
          : state.courses
              .map((c) => {
                const theme = COLOR_MAP[c.color] || COLOR_MAP.indigo;
                return `
                  <div class="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200/80 rounded-2xl px-3 py-2.5">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <span class="w-3 h-3 rounded-full ${theme.solid} shrink-0"></span>
                      <div class="min-w-0">
                        <p class="text-xs font-bold text-[#0F172A] truncate">${escapeHtml(c.name)}</p>
                        <p class="text-[10px] text-[#64748B] truncate">${c.lessons.length} lessons • ${escapeHtml(c.desc)}</p>
                      </div>
                    </div>
                    <button
                      type="button"
                      onclick="deleteCourse('${escapeHtml(c.id)}')"
                      title="Delete course"
                      class="shrink-0 text-xs font-bold text-rose-600 hover:bg-rose-50 px-2.5 py-1.5 rounded-xl border border-rose-200 transition-all"
                    >
                      🗑️ Delete
                    </button>
                  </div>
                `;
              })
              .join('');

      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h2 class="text-base font-extrabold text-[#0F172A]">Manage Courses</h2>
            <p class="text-[11px] text-[#64748B]">Add new subjects or remove existing ones</p>
          </div>
          <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold text-sm">✕</button>
        </div>

        <div class="p-5 overflow-y-auto no-scrollbar space-y-5">
          <!-- Add Course Form -->
          <form onsubmit="handleAddCourse(event)" class="bg-indigo-50/50 border border-indigo-100 rounded-2xl p-3.5 space-y-3">
            <p class="text-xs font-extrabold text-[#4F46E5]">＋ Add New Course</p>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Course Name</label>
              <input
                id="new-course-name"
                type="text"
                required
                placeholder="e.g., Computer Science"
                class="w-full text-xs bg-white border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-[#4F46E5]"
              />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Short Description</label>
              <input
                id="new-course-desc"
                type="text"
                placeholder="e.g., Data Structures & Algorithms"
                class="w-full text-xs bg-white border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-[#4F46E5]"
              />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1.5">Badge Color</label>
              <div class="flex flex-wrap gap-1.5">${colorsHtml}</div>
            </div>
            <button
              type="submit"
              class="w-full bg-[#4F46E5] hover:bg-indigo-700 text-white text-xs font-bold py-2.5 rounded-xl shadow-xs transition-all"
            >
              Add Course
            </button>
          </form>

          <!-- Existing Courses List -->
          <div>
            <p class="text-xs font-extrabold text-slate-800 mb-2">Existing Courses (${state.courses.length})</p>
            <p class="text-[11px] text-[#64748B] mb-2.5">Deleting a course moves its linked flashcards, quizzes, and books to <strong>Uncategorized</strong>.</p>
            <div class="space-y-2">${existingCoursesHtml}</div>
          </div>
        </div>
      `);
    }

    function handleAddCourse(e) {
      e.preventDefault();
      const nameInput = document.getElementById('new-course-name');
      const descInput = document.getElementById('new-course-desc');
      const name = nameInput.value.trim();
      if (!name) return;

      const newCourse = {
        id: uid('course'),
        name,
        color: selectedNewCourseColor,
        desc: descInput.value.trim() || 'Custom subject module',
        lessons: [],
      };
      state.courses.push(newCourse);
      renderApp();
      openManageCoursesModal();
      showToast(`Added course "${name}"`, '📚');
    }

    function deleteCourse(courseId) {
      const course = getCourse(courseId);
      if (!course) return;
      const deletedName = course.name;

      state.courses = state.courses.filter((c) => c.id !== courseId);

      state.decks.forEach((d) => {
        if (d.courseId === courseId) d.courseId = null;
      });
      state.quizzes.forEach((q) => {
        if (q.courseId === courseId) q.courseId = null;
      });
      state.books.forEach((b) => {
        if (b.courseId === courseId) b.courseId = null;
      });

      if (state.activeCourseId === courseId) {
        state.activeCourseId = null;
      }
      if (state.toolsCourseFilter === courseId) state.toolsCourseFilter = 'all';
      if (state.resourcesCourseFilter === courseId) state.resourcesCourseFilter = 'all';

      renderApp();
      openManageCoursesModal();
      showToast(`Deleted "${deletedName}" (items moved to Uncategorized)`, '🗑️');
    }

    let pendingLessonPdf = null;

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return '1.1 MB';
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function onNewLessonPdfSelected(inputEl, courseId) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      pendingLessonPdf = {
        fileName: file.name,
        fileSize: formatBytes(file.size),
        objectUrl: URL.createObjectURL(file),
        previewText: `Uploaded PDF file "${file.name}" (${formatBytes(file.size)}). Ready to view in the Lesson Reader.`,
      };
      openManageLessonsModal(courseId, true);
      showToast(`Attached "${file.name}"`, '📄');
    }

    function attachSampleNewLessonPdf(courseId) {
      const course = getCourse(courseId);
      const slug = (course?.name || 'Course').replace(/\s+/g, '_');
      pendingLessonPdf = {
        fileName: `${slug}_Lecture_Slides.pdf`,
        fileSize: '1.8 MB',
        objectUrl: null,
        previewText: `Sample PDF handout for ${course?.name || 'this lesson'}: includes diagrams, summary tables, and worked review exercises.`,
      };
      openManageLessonsModal(courseId, true);
      showToast(`Attached "${pendingLessonPdf.fileName}"`, '📄');
    }

    function clearPendingLessonPdf(courseId) {
      pendingLessonPdf = null;
      openManageLessonsModal(courseId, true);
    }

    function openManageLessonsModal(courseId, preserveDraft = false) {
      const course = getCourse(courseId);
      if (!course) return;
      if (!preserveDraft) {
        pendingLessonPdf = null;
      }

      const prevTitle = preserveDraft ? document.getElementById('new-lesson-title')?.value || '' : '';
      const prevTime = preserveDraft ? document.getElementById('new-lesson-time')?.value || '10 min read' : '10 min read';
      const prevNotes = preserveDraft ? document.getElementById('new-lesson-notes')?.value || '' : '';

      const lessonsListHtml =
        course.lessons.length === 0
          ? `<p class="text-xs text-[#64748B] py-2">No lessons in this course yet.</p>`
          : course.lessons
              .map(
                (l) => `
                <div class="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200/80 rounded-2xl px-3 py-2.5">
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                      <p class="text-xs font-bold text-[#0F172A] truncate">${escapeHtml(l.title)}</p>
                      ${
                        l.pdfAttachment
                          ? `<span class="shrink-0 text-[9px] font-bold px-1.5 py-0.5 rounded bg-rose-50 text-rose-700 border border-rose-200">PDF</span>`
                          : ''
                      }
                    </div>
                    <p class="text-[10px] text-[#64748B] truncate">${escapeHtml(l.readTime)}${
                  l.pdfAttachment ? ` • ${escapeHtml(l.pdfAttachment.fileName)}` : ''
                }</p>
                  </div>
                  <button
                    type="button"
                    onclick="deleteLesson('${escapeHtml(course.id)}', '${escapeHtml(l.id)}')"
                    class="shrink-0 text-xs font-bold text-rose-600 hover:bg-rose-50 px-2.5 py-1.5 rounded-xl border border-rose-200"
                  >
                    🗑️ Delete
                  </button>
                </div>
              `
              )
              .join('');

      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h2 class="text-base font-extrabold text-[#0F172A]">Manage Lessons</h2>
            <p class="text-[11px] text-[#64748B]">${escapeHtml(course.name)}</p>
          </div>
          <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold text-sm">✕</button>
        </div>

        <div class="p-5 overflow-y-auto no-scrollbar space-y-5">
          <!-- Add Lesson Form -->
          <form onsubmit="handleAddLesson(event, '${escapeHtml(course.id)}')" class="bg-indigo-50/50 border border-indigo-100 rounded-2xl p-3.5 space-y-3">
            <p class="text-xs font-extrabold text-[#4F46E5]">＋ Add New Lesson</p>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Lesson Title</label>
              <input
                id="new-lesson-title"
                type="text"
                required
                value="${escapeHtml(prevTitle)}"
                placeholder="e.g., Integration by Substitution"
                class="w-full text-xs bg-white border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-[#4F46E5]"
              />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Estimated Read Time</label>
              <input
                id="new-lesson-time"
                type="text"
                value="${escapeHtml(prevTime)}"
                class="w-full text-xs bg-white border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-[#4F46E5]"
              />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Lesson Notes</label>
              <textarea
                id="new-lesson-notes"
                rows="3"
                placeholder="Write key concepts, definitions, or formulas..."
                class="w-full text-xs bg-white border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-[#4F46E5]"
              >${escapeHtml(prevNotes)}</textarea>
            </div>

            <!-- Upload Lesson PDF Control -->
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Lesson PDF Handout (Optional)</label>
              <input
                id="new-lesson-pdf-input"
                type="file"
                accept=".pdf,application/pdf"
                class="hidden"
                onchange="onNewLessonPdfSelected(this, '${escapeHtml(course.id)}')"
              />
              ${
                pendingLessonPdf
                  ? `
                <div class="flex items-center justify-between gap-2 bg-white border border-rose-200 rounded-xl px-3 py-2">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="text-sm">📄</span>
                    <div class="min-w-0">
                      <p class="text-[11px] font-bold text-[#0F172A] truncate">${escapeHtml(pendingLessonPdf.fileName)}</p>
                      <p class="text-[10px] text-[#64748B]">${escapeHtml(pendingLessonPdf.fileSize)}</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onclick="clearPendingLessonPdf('${escapeHtml(course.id)}')"
                    class="text-[11px] font-bold text-rose-600 hover:underline shrink-0"
                  >
                    Remove
                  </button>
                </div>
              `
                  : `
                <div class="bg-white border border-dashed border-slate-300 rounded-xl p-2.5 flex items-center justify-between gap-2">
                  <button
                    type="button"
                    onclick="document.getElementById('new-lesson-pdf-input').click()"
                    class="inline-flex items-center gap-1.5 text-xs font-bold text-[#4F46E5] hover:underline"
                  >
                    <span>📎</span>
                    <span>Upload PDF File</span>
                  </button>
                  <button
                    type="button"
                    onclick="attachSampleNewLessonPdf('${escapeHtml(course.id)}')"
                    class="text-[10px] font-bold text-slate-500 hover:text-slate-800 bg-slate-100 px-2 py-1 rounded-lg"
                  >
                    Use Sample PDF
                  </button>
                </div>
              `
              }
            </div>

            <button
              type="submit"
              class="w-full bg-[#4F46E5] hover:bg-indigo-700 text-white text-xs font-bold py-2.5 rounded-xl shadow-xs"
            >
              Add Lesson to ${escapeHtml(course.name)}
            </button>
          </form>

          <!-- Existing Lessons -->
          <div>
            <p class="text-xs font-extrabold text-slate-800 mb-2">Lessons in ${escapeHtml(course.name)} (${course.lessons.length})</p>
            <div class="space-y-2">${lessonsListHtml}</div>
          </div>
        </div>
      `);
    }

    function handleAddLesson(e, courseId) {
      e.preventDefault();
      const course = getCourse(courseId);
      if (!course) return;
      const title = document.getElementById('new-lesson-title').value.trim();
      const readTime = document.getElementById('new-lesson-time').value.trim() || '10 min read';
      const notes =
        document.getElementById('new-lesson-notes').value.trim() ||
        'Structured study notes for ' + title + '. Review core definitions and worked examples.';

      if (!title) return;
      course.lessons.push({
        id: uid('lesson'),
        title,
        readTime,
        completed: false,
        pdfAttachment: pendingLessonPdf ? { ...pendingLessonPdf } : null,
        notes,
      });

      pendingLessonPdf = null;
      renderApp();
      openManageLessonsModal(courseId);
      showToast(`Added lesson "${title}"`, '📖');
    }

    function deleteLesson(courseId, lessonId) {
      const course = getCourse(courseId);
      if (!course) return;

    function fillAiSampleNotes() {
      const course = getCourse(aiModalState.courseId);
      const name = (course?.name || '').toLowerCase();
      if (name.includes('math')) {
        aiModalState.notes =
          'Chain Rule : Method for finding the derivative of composite functions f(g(x)).\n' +
          'Critical Point : Interior point where the first derivative equals zero or is undefined.\n' +
          'Definite Integral : Net signed area between a function curve and the x-axis on [a, b].\n' +
          'Inflection Point : Point on a curve where concavity changes sign.';
      } else if (name.includes('english')) {
        aiModalState.notes =
          'Synecdoche : Figure of speech where a part represents the whole or vice versa.\n' +
          'Counterargument : Opposing viewpoint addressed in an essay to strengthen credibility.\n' +
          'Syntax : Arrangement of words and phrases to create well-formed sentences.\n' +
          'Tone : The author’s attitude toward the subject and audience conveyed through word choice.';
      } else {
        aiModalState.notes =
          'Mitochondria : Organelle that generates most of a cell’s ATP via aerobic respiration.\n' +
          'Osmosis : Net movement of water molecules across a semipermeable membrane.\n' +
          'Mitosis : Cell division producing two genetically identical diploid daughter cells.\n' +
          'Enzyme : Biological catalyst that speeds up reactions by lowering activation energy.';
      }
      renderGenerateAiModal();
    }

    function runAiGeneration() {
      const textarea = document.getElementById('ai-notes-input');
      if (textarea) aiModalState.notes = textarea.value;

      const raw = aiModalState.notes.trim();
      const course = getCourse(aiModalState.courseId);
      const topicLabel = course ? course.name : 'General Study';

      const lines = raw
        .split(/\n+/)
        .map((l) => l.trim())
        .filter(Boolean);

      const pairs = [];
      lines.forEach((line) => {
        const colonIdx = line.indexOf(':');
        const dashIdx = line.indexOf(' - ');
        if (colonIdx > 1) {
          pairs.push({
            q: line.slice(0, colonIdx).replace(/^[-•*]\s*/, '').trim(),
            a: line.slice(colonIdx + 1).trim(),
          });
        } else if (dashIdx > 1) {
          pairs.push({
            q: line.slice(0, dashIdx).replace(/^[-•*]\s*/, '').trim(),
            a: line.slice(dashIdx + 3).trim(),
          });
        } else if (line.length > 8) {
          const words = line.split(/\s+/);
          const term = words.slice(0, Math.min(3, words.length)).join(' ');
          pairs.push({ q: `Key Concept: ${term}`, a: line });
        }
      });

      if (pairs.length === 0) {
        pairs.push(
          { q: `${topicLabel} Core Principle 1`, a: 'Fundamental relationship connecting theory to problem-solving.' },
          { q: `${topicLabel} Core Principle 2`, a: 'Key mechanism or formula frequently tested in assessments.' },
          { q: `${topicLabel} Core Principle 3`, a: 'Practical application and edge-case condition to remember.' }
        );
      }

      aiModalState.previewTitle = `${topicLabel} • AI Study Set`;
      aiModalState.previewCards =
        aiModalState.mode === 'flashcards' || aiModalState.mode === 'both' ? pairs : [];

      aiModalState.previewQuestions =
        aiModalState.mode === 'quiz' || aiModalState.mode === 'both'
          ? pairs.map((p, idx) => {
              const otherAnswers = pairs.filter((_, i) => i !== idx).map((x) => x.a);
              return {
                prompt: `Which statement best defines "${p.q}"?`,
                options: [
                  p.a,
                  otherAnswers[0] || 'An unrelated secondary process in another domain.',
                  otherAnswers[1] || 'A measurement of external environmental resistance.',
                  'None of the listed descriptions apply.',
                ],
                answerIndex: 0,
              };
            })
          : [];

      renderGenerateAiModal();
      playPrototypeChime(780);
      showToast('Gemini generated your study preview!', '✨');
    }

            ${

                ? `<div class="space-y-2">
                    <p class="text-[11px] font-extrabold uppercase tracking-wider text-[#64748B]">Quiz Questions (${aiModalState.previewQuestions.length})</p>
                    ${aiModalState.previewQuestions
                      .map(
                        (q, i) => `
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 flex items-start justify-between gap-2">
                          <div>
                            <p class="text-xs font-bold text-[#0F172A]">${escapeHtml(q.prompt)}</p>
                            <p class="text-[11px] text-emerald-700 font-semibold mt-0.5">✓ ${escapeHtml(q.options[0])}</p>
                          </div>
                          <button type="button" onclick="removePreviewQuestion(${i})" class="text-rose-500 text-xs font-bold px-1.5">✕</button>
                        </div>
                      `
                      )
                      .join('')}
                  </div>`
                : ''
            }

            <button
              type="button"
              onclick="saveGeneratedAiContent()"
              class="w-full bg-[#10B981] hover:bg-emerald-600 text-white text-xs font-extrabold py-3 rounded-2xl shadow-sm transition-all"
            >
              ✓ Save to Selected Course
            </button>
          </div>
        `;

      openModal(`
        <!-- Top Bar -->
        <div class="px-4 pt-3.5 pb-3 border-b border-slate-100 flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button type="button" onclick="closeModal()" class="text-sm font-extrabold text-slate-700 hover:text-slate-900 px-1.5">←</button>
            <h2 class="text-base font-extrabold text-[#0F172A]">Generate with AI</h2>
          </div>
          <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-indigo-50 text-[#4F46E5] border border-indigo-100">
            Gemini • Free tier
          </span>
        </div>

        <div class="p-4 overflow-y-auto no-scrollbar space-y-3.5">
          <div>
            <p class="text-xs font-bold text-[#0F172A]">Create study material</p>
            <p class="text-[11px] text-[#64748B] mt-0.5">Paste notes or attach a .pdf/.txt file. Gemini builds flashcards and quizzes directly into your chosen course.</p>
          </div>

          <!-- Segmented Toggle: Flashcards | Quiz | Both -->
          <div class="bg-slate-100 p-1 rounded-2xl grid grid-cols-3 gap-1">
            ${['flashcards', 'quiz', 'both']
              .map((m) => {
                const label = m === 'flashcards' ? 'Flashcards' : m === 'quiz' ? 'Quiz' : 'Both';
                const active = aiModalState.mode === m;
                return `
                  <button
                    type="button"
                    onclick="setAiMode('${m}')"
                    class="py-1.5 text-xs font-bold rounded-xl transition-all ${
                      active ? 'bg-white text-[#4F46E5] shadow-xs' : 'text-[#64748B]'
                    }"
                  >
                    ${label}
                  </button>
                `;
              })
              .join('')}
          </div>

          <!-- Course Selector Dropdown -->
          <div>
            <label class="block text-[10px] font-extrabold uppercase tracking-wider text-[#64748B] mb-1">
              Assign to Course
            </label>
            <select
              onchange="setAiCourse(this.value)"
              class="w-full text-xs font-bold text-[#0F172A] bg-white border border-[#E2E8F0] rounded-2xl px-3 py-2.5 focus:outline-none focus:border-[#4F46E5]"
            >
              ${buildCourseOptionsHtml(aiModalState.courseId)}
            </select>
          </div>

          <!-- Notes Textarea + Fill Sample Link -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-[11px] font-bold text-[#4F46E5]">Paste your notes</label>
              <button type="button" onclick="fillAiSampleNotes()" class="text-[11px] font-bold text-[#4F46E5] hover:underline">
                Fill sample notes
              </button>
            </div>
            <textarea
              id="ai-notes-input"
              rows="4"
              oninput="aiModalState.notes = this.value"
              placeholder="Paste lecture notes, definitions, or bullet points..."
              class="w-full text-xs bg-white border border-[#E2E8F0] rounded-2xl p-3 focus:outline-none focus:border-[#4F46E5]"
            >${escapeHtml(aiModalState.notes)}</textarea>
          </div>

          <!-- Simulated Attach PDF/TXT Box -->
          <div class="flex items-center justify-between bg-slate-50 border border-[#E2E8F0] rounded-2xl px-3.5 py-2.5">
            <div class="flex items-center gap-2.5">
              <span class="text-base">📄</span>
              <div>
                <p class="text-xs font-bold text-[#0F172A]">
                  ${aiModalState.fileAttached ? 'Lecture_Module_Notes.pdf' : 'No file attached'}
                </p>
                <p class="text-[10px] text-[#64748B]">
                  ${aiModalState.fileAttached ? '1.2 MB • Ready to extract' : 'PDF or TXT • max 20 MB'}
                </p>
              </div>
            </div>
            <button
              type="button"
              onclick="toggleAiAttachment()"
              class="text-xs font-bold text-[#4F46E5] hover:underline"
            >
              ${aiModalState.fileAttached ? 'Remove' : 'Attach'}
            </button>
          </div>

          <!-- Generate CTA -->
          <button
            type="button"
            onclick="runAiGeneration()"
            class="w-full flex items-center justify-center gap-1.5 bg-[#4F46E5] hover:bg-indigo-700 text-white text-xs font-extrabold py-3 rounded-2xl shadow-sm transition-all"
          >
            <span>✨</span>
            <span>Generate Study Material</span>
          </button>

          ${previewHtml}
        </div>
      `);
    }

    // =========================================================================
    // 13. INTERACTIVE STUDY PLAYERS (LESSON READER + PDF, 3D DECK, QUIZ, BOOK)
    // =========================================================================
    let lessonPdfPreviewExpanded = false;

    function toggleLessonPdfPreview(courseId, lessonId) {
      lessonPdfPreviewExpanded = !lessonPdfPreviewExpanded;
      openLessonReaderModal(courseId, lessonId, true);
    }

    function onExistingLessonPdfUploaded(inputEl, courseId, lessonId) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const course = getCourse(courseId);
      const lesson = course?.lessons.find((l) => l.id === lessonId);
      if (!lesson) return;

      lesson.pdfAttachment = {
        fileName: file.name,
        fileSize: formatBytes(file.size),
        objectUrl: URL.createObjectURL(file),
        previewText: `Uploaded PDF "${file.name}" (${formatBytes(file.size)}).`,
      };
      lessonPdfPreviewExpanded = true;
      renderApp();
      openLessonReaderModal(courseId, lessonId, true);
      showToast(`Uploaded "${file.name}" to lesson`, '📄');
    }

    function attachSamplePdfToLesson(courseId, lessonId) {
      const course = getCourse(courseId);
      const lesson = course?.lessons.find((l) => l.id === lessonId);
      if (!lesson) return;

      const cleanTitle = lesson.title.replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, '');
      lesson.pdfAttachment = {
        fileName: `${cleanTitle || 'Lesson'}_Notes.pdf`,
        fileSize: '1.3 MB',
        objectUrl: null,
        previewText: `Attached PDF study packet for "${lesson.title}" — contains annotated diagrams, key equations, and summary review questions.`,
      };
      lessonPdfPreviewExpanded = true;
      renderApp();
      openLessonReaderModal(courseId, lessonId, true);
      showToast(`Attached "${lesson.pdfAttachment.fileName}"`, '📄');
    }

    function removeLessonPdf(courseId, lessonId) {
      const course = getCourse(courseId);
      const lesson = course?.lessons.find((l) => l.id === lessonId);
      if (!lesson) return;
      lesson.pdfAttachment = null;
      lessonPdfPreviewExpanded = false;
      renderApp();
      openLessonReaderModal(courseId, lessonId, true);
      showToast('Removed PDF from lesson', '🗑️');
    }

    function openLessonReaderModal(courseId, lessonId, keepPreviewState = false) {
      const course = getCourse(courseId);
      const lesson = course?.lessons.find((l) => l.id === lessonId);
      if (!course || !lesson) return;
      if (!keepPreviewState) {
        lessonPdfPreviewExpanded = false;
      }

      const pdf = lesson.pdfAttachment;
      const pdfSectionHtml = pdf
        ? `
          <div class="bg-rose-50/60 border border-rose-200 rounded-2xl p-3.5 space-y-2.5">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-9 h-9 rounded-xl bg-rose-100 text-rose-700 font-extrabold text-xs flex items-center justify-center shrink-0">
                  PDF
                </div>
                <div class="min-w-0">
                  <p class="text-xs font-bold text-[#0F172A] truncate">${escapeHtml(pdf.fileName)}</p>
                  <p class="text-[10px] text-[#64748B]">${escapeHtml(pdf.fileSize)} • Lesson Attachment</p>
                </div>
              </div>
              <button
                type="button"
                onclick="toggleLessonPdfPreview('${escapeHtml(course.id)}', '${escapeHtml(lesson.id)}')"
                class="shrink-0 text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white border border-rose-200 text-rose-700 hover:bg-rose-50"
              >
                ${lessonPdfPreviewExpanded ? 'Hide PDF' : 'View PDF'}
              </button>
            </div>

            ${
              lessonPdfPreviewExpanded
                ? pdf.objectUrl
                  ? `<div class="rounded-xl overflow-hidden border border-slate-200 bg-white">
                      <iframe src="${escapeHtml(pdf.objectUrl)}" title="Lesson PDF Preview" class="w-full h-56 border-0"></iframe>
                    </div>`
                  : `<div class="bg-white border border-slate-200 rounded-xl p-3 text-[11px] text-slate-700 leading-relaxed">
                      <p class="font-bold text-slate-900 mb-1">📄 Document Viewer Preview</p>
                      <p>${escapeHtml(pdf.previewText)}</p>
                    </div>`
                : ''
            }

            <div class="flex items-center justify-between pt-1 border-t border-rose-200/60 text-[11px] font-bold">
              <button
                type="button"
                onclick="document.getElementById('lesson-reader-pdf-input').click()"
                class="text-[#4F46E5] hover:underline"
              >
                Replace PDF
              </button>
              <button
                type="button"
                onclick="removeLessonPdf('${escapeHtml(course.id)}', '${escapeHtml(lesson.id)}')"
                class="text-rose-600 hover:underline"
              >
                Remove PDF
              </button>
            </div>
          </div>
        `
        : `
          <div class="bg-slate-50 border border-dashed border-slate-300 rounded-2xl p-3.5 flex items-center justify-between gap-2">
            <div>
              <p class="text-xs font-bold text-slate-800">Attach a PDF to this lesson</p>
              <p class="text-[10px] text-[#64748B]">Upload lecture slides or study handouts</p>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button
                type="button"
                onclick="document.getElementById('lesson-reader-pdf-input').click()"
                class="text-xs font-bold bg-white hover:bg-indigo-50 text-[#4F46E5] border border-indigo-200 px-3 py-1.5 rounded-xl"
              >
                📎 Upload PDF
              </button>
              <button
                type="button"
                onclick="attachSamplePdfToLesson('${escapeHtml(course.id)}', '${escapeHtml(lesson.id)}')"
                class="text-[10px] font-bold bg-slate-200/70 text-slate-700 px-2 py-1.5 rounded-xl"
              >
                Sample
              </button>
            </div>
          </div>
        `;

      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-slate-100 flex items-center justify-between">
          ${getCourseBadgeHtml(course.id)}
          <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold text-sm">✕</button>
        </div>

        <div class="p-5 overflow-y-auto no-scrollbar space-y-4">
          <input
            id="lesson-reader-pdf-input"
            type="file"
            accept=".pdf,application/pdf"
            class="hidden"
            onchange="onExistingLessonPdfUploaded(this, '${escapeHtml(course.id)}', '${escapeHtml(lesson.id)}')"
          />

          <div>
            <h2 class="text-lg font-extrabold text-[#0F172A] leading-snug">${escapeHtml(lesson.title)}</h2>
            <p class="text-xs text-[#64748B] mt-1">🕒 ${escapeHtml(lesson.readTime)}</p>
          </div>

          ${pdfSectionHtml}

          <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 text-xs text-slate-800 leading-relaxed whitespace-pre-line">
            ${escapeHtml(lesson.notes)}
          </div>

          <button
            type="button"
            onclick="toggleLessonComplete('${escapeHtml(course.id)}', '${escapeHtml(lesson.id)}')"
            class="w-full py-3 rounded-2xl text-xs font-extrabold transition-all ${
              lesson.completed
                ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                : 'bg-[#10B981] hover:bg-emerald-600 text-white shadow-sm'
            }"
          >
            ${lesson.completed ? '✓ Lesson Completed (Tap to Undo)' : 'Mark Lesson Complete'}
          </button>
        </div>
      `);
    }

    function toggleLessonComplete(courseId, lessonId) {
      const course = getCourse(courseId);
      const lesson = course?.lessons.find((l) => l.id === lessonId);
      if (!lesson) return;
      lesson.completed = !lesson.completed;
      renderApp();
      openLessonReaderModal(courseId, lessonId, true);
      if (lesson.completed) {
        recordStudyProgress(`Completed "${lesson.title}"`);
      }
    }

    // 3D Flashcard Player State
    let playerDeckState = { deckId: null, index: 0, flipped: false };

    function openDeckPlayerModal(deckId) {
      playerDeckState = { deckId, index: 0, flipped: false };
      renderDeckPlayerModal();
    }

    function flipActiveCard() {
      playerDeckState.flipped = !playerDeckState.flipped;
      playPrototypeChime(520);
      renderDeckPlayerModal();
    }

    function stepActiveCard(delta) {
      const deck = state.decks.find((d) => d.id === playerDeckState.deckId);
      if (!deck || deck.cards.length === 0) return;
      playerDeckState.index = (playerDeckState.index + delta + deck.cards.length) % deck.cards.length;
      playerDeckState.flipped = false;
      renderDeckPlayerModal();
    }

    function finishDeckSession() {
      const deck = state.decks.find((d) => d.id === playerDeckState.deckId);
      closeModal();
      renderApp();
      recordStudyProgress(`Completed deck "${deck?.title || 'Flashcards'}"`);
    }

    function renderDeckPlayerModal() {
      const deck = state.decks.find((d) => d.id === playerDeckState.deckId);
      if (!deck) return;
      const card = deck.cards[playerDeckState.index];

      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h2 class="text-sm font-extrabold text-[#0F172A]">${escapeHtml(deck.title)}</h2>
            <p class="text-[11px] text-[#64748B]">Card ${playerDeckState.index + 1} of ${deck.cards.length}</p>
          </div>
          <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold text-sm">✕</button>
        </div>

        <div class="p-5 space-y-4">
          <!-- 3D Flip Card -->
          <div onclick="flipActiveCard()" class="cursor-pointer flip-perspective h-56 w-full select-none">
            <div class="flip-inner ${playerDeckState.flipped ? 'is-flipped' : ''}">
              <!-- Front -->
              <div class="flip-face bg-white border-2 border-indigo-200 rounded-[24px] p-5 flex flex-col items-center justify-center text-center shadow-xs">
                <span class="text-[10px] font-extrabold uppercase tracking-wider text-[#4F46E5] bg-indigo-50 px-2.5 py-0.5 rounded-full mb-3">
                  Term / Prompt
                </span>
                <p class="text-base font-extrabold text-[#0F172A]">${escapeHtml(card.q)}</p>
                <span class="text-[11px] text-[#64748B] mt-4">Tap card to flip ↻</span>
              </div>
              <!-- Back -->
              <div class="flip-face flip-back bg-indigo-600 text-white rounded-[24px] p-5 flex flex-col items-center justify-center text-center shadow-sm">
                <span class="text-[10px] font-extrabold uppercase tracking-wider text-indigo-100 bg-white/15 px-2.5 py-0.5 rounded-full mb-3">
                  Answer / Definition
                </span>
                <p class="text-sm font-bold leading-relaxed">${escapeHtml(card.a)}</p>
                <span class="text-[11px] text-indigo-200 mt-4">Tap card to flip back ↺</span>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="stepActiveCard(-1)" class="py-2.5 rounded-2xl border border-[#E2E8F0] text-xs font-bold text-slate-700 hover:bg-slate-50">
              ← Previous
            </button>
            <button type="button" onclick="stepActiveCard(1)" class="py-2.5 rounded-2xl bg-[#4F46E5] text-white text-xs font-bold hover:bg-indigo-700">
              Next Card →
            </button>
          </div>

          <button type="button" onclick="finishDeckSession()" class="w-full py-2.5 rounded-2xl bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-extrabold">
            ✓ Finish &amp; Log Session
          </button>
        </div>
      `);
    }

    // Quiz Runner State
    let quizRunnerState = { quizId: null, qIndex: 0, selectedOption: null, score: 0, finished: false };

    function openQuizRunnerModal(quizId) {
      quizRunnerState = { quizId, qIndex: 0, selectedOption: null, score: 0, finished: false };
      renderQuizRunnerModal();
    }

    function selectQuizOption(optIndex) {
      if (quizRunnerState.selectedOption !== null) return;
      const quiz = state.quizzes.find((q) => q.id === quizRunnerState.quizId);
      const item = quiz?.questions[quizRunnerState.qIndex];
      if (!item) return;

      quizRunnerState.selectedOption = optIndex;
      if (optIndex === item.answerIndex) {
        quizRunnerState.score += 1;
        playPrototypeChime(700);
      } else {
        playPrototypeChime(320);
      }
      renderQuizRunnerModal();
    }

    function advanceQuizQuestion() {
      const quiz = state.quizzes.find((q) => q.id === quizRunnerState.quizId);
      if (!quiz) return;
      if (quizRunnerState.qIndex + 1 < quiz.questions.length) {
        quizRunnerState.qIndex += 1;
        quizRunnerState.selectedOption = null;
        renderQuizRunnerModal();
      } else {
        quizRunnerState.finished = true;
        renderQuizRunnerModal();
        recordStudyProgress(`Scored ${quizRunnerState.score}/${quiz.questions.length} on "${quiz.title}"`);
        renderApp();
      }
    }

    function renderQuizRunnerModal() {
      const quiz = state.quizzes.find((q) => q.id === quizRunnerState.quizId);
      if (!quiz) return;

      if (quizRunnerState.finished) {
        const pct = Math.round((quizRunnerState.score / quiz.questions.length) * 100);
        openModal(`
          <div class="p-6 text-center space-y-4">
            <div class="w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200 flex items-center justify-center text-2xl font-extrabold mx-auto">
              🏆
            </div>
            <div>
              <h2 class="text-lg font-extrabold text-[#0F172A]">Quiz Complete!</h2>
              <p class="text-xs text-[#64748B] mt-1">${escapeHtml(quiz.title)}</p>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4">
              <p class="text-2xl font-extrabold text-[#4F46E5]">${quizRunnerState.score} / ${quiz.questions.length}</p>
              <p class="text-xs font-bold text-emerald-600 mt-0.5">${pct}% Accuracy</p>
            </div>
            <button type="button" onclick="closeModal()" class="w-full bg-[#4F46E5] text-white text-xs font-extrabold py-3 rounded-2xl">
              Done
            </button>
          </div>
        `);
        return;
      }

      const item = quiz.questions[quizRunnerState.qIndex];
      const answered = quizRunnerState.selectedOption !== null;

      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h2 class="text-sm font-extrabold text-[#0F172A]">${escapeHtml(quiz.title)}</h2>
            <p class="text-[11px] text-[#64748B]">Question ${quizRunnerState.qIndex + 1} of ${quiz.questions.length}</p>
          </div>
          <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold text-sm">✕</button>
        </div>

        <div class="p-5 space-y-3.5">
          <p class="text-sm font-bold text-[#0F172A] leading-snug">${escapeHtml(item.prompt)}</p>

          <div class="space-y-2">
            ${item.options
              .map((opt, idx) => {
                let style = 'bg-white border-slate-200 text-slate-800 hover:border-indigo-300';
                if (answered) {
                  if (idx === item.answerIndex) {
                    style = 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold';
                  } else if (idx === quizRunnerState.selectedOption) {
                    style = 'bg-rose-50 border-rose-400 text-rose-900';
                  } else {
                    style = 'bg-slate-50 border-slate-200 text-slate-400';
                  }
                }
                return `
                  <button
                    type="button"
                    onclick="selectQuizOption(${idx})"
                    class="w-full text-left text-xs border rounded-2xl p-3 transition-all ${style}"
                  >
                    ${escapeHtml(opt)}
                  </button>
                `;
              })
              .join('')}
          </div>

          ${
            answered
              ? `<button type="button" onclick="advanceQuizQuestion()" class="w-full bg-[#4F46E5] text-white text-xs font-extrabold py-3 rounded-2xl">
                  ${quizRunnerState.qIndex + 1 < quiz.questions.length ? 'Next Question →' : 'View Score Summary'}
                </button>`
              : ''
          }
        </div>
      `);
    }

    function openBookReaderModal(bookId) {
      const book = state.books.find((b) => b.id === bookId);
      if (!book) return;

      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-slate-100 flex items-center justify-between">
          ${getCourseBadgeHtml(book.courseId)}
          <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold text-sm">✕</button>
        </div>
        <div class="p-5 space-y-4">
          <div>
            <h2 class="text-base font-extrabold text-[#0F172A]">${escapeHtml(book.title)}</h2>
            <p class="text-xs text-[#64748B]">${escapeHtml(book.author)} • ${escapeHtml(book.pages)}</p>
          </div>
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-xs text-slate-700 leading-relaxed">
            <p class="font-bold text-slate-900 mb-1">Chapter Excerpt Preview</p>
            <p>Interactive PDF reading view. Track your reading progress and categorize this textbook under any course or keep it Uncategorized.</p>
          </div>
          <div>
            <div class="flex justify-between text-xs font-bold mb-1">
              <span class="text-[#64748B]">Reading Progress</span>
              <span class="text-emerald-600">${book.progressPct}%</span>
            </div>
            <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
              <div class="h-full bg-[#10B981]" style="width: ${book.progressPct}%"></div>
            </div>
          </div>
          <button
            type="button"
            onclick="advanceBookProgress('${escapeHtml(book.id)}')"
            class="w-full bg-[#4F46E5] hover:bg-indigo-700 text-white text-xs font-extrabold py-3 rounded-2xl"
          >
            + Log 15% Reading Progress
          </button>
        </div>
      `);
    }

    function advanceBookProgress(bookId) {
      const book = state.books.find((b) => b.id === bookId);
      if (!book) return;
      book.progressPct = Math.min(100, book.progressPct + 15);
      renderApp();
      openBookReaderModal(bookId);
      recordStudyProgress(`Logged reading progress on "${book.title}"`);
    }

    // Boot prototype
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
